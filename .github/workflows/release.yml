name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format (YYYY.MM.DD)
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match YYYY.MM.DD"
            exit 1
          fi

      - name: Verify td_lastBeatStanding.tox is present
        run: |
          if [ ! -f td_lastBeatStanding.tox ]; then
            echo "td_lastBeatStanding.tox not found in repository root"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}" \
            td_lastBeatStanding.tox
